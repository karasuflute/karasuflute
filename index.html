<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>[KAAA] 正規品判定サイト</title>
    <style>
        /* 画面全体の背景（壁紙）の設定 */
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            text-align: center; 
            padding: 80px 20px; 
            
            background-color: #0d1117;          /* 背景のベース色を黒にしておく */
            background-image: url('icon.png');  /* アップロードした画像 */
            background-repeat: no-repeat;       /* 画像を繰り返さない */
            background-position: center 15%;    /* 画面の真ん中、上から15%の位置に配置 */
            
            /* ★ここを変更してサイズを細かく指定します */
            background-size: 150px;             /* 横幅を150ピクセルに縮小（数字を小さくするとさらに小さくなります） */
            
            background-attachment: fixed; 
            color: #c9d1d9; 
            margin: 0;
        }
        /* 入力エリアを囲む白い枠の設定 */
        .search-box { 
            background: #161b22; /* ★枠の内側を濃いグレーに変更 */
            padding: 40px 30px; 
            border-radius: 12px; /* 角を少し丸く */
            display: inline-block; 
            box-shadow: 0 0 20px rgba(0, 123, 255, 0.2); /* ★青い光のグラデーション */
            border: 1px solid #30363d; /* 薄い枠線 */
            max-width: 450px;
            width: 100%;
        }
        h2 { color: #ffffff; margin-bottom: 10px; font-size: 24px; }
        p { color: #8b949e; font-size: 14px; margin-bottom: 25px; }
        /* 文字を入力する箱（インプット欄）の設定 */
        input { 
            padding: 12px; 
            width: 280px; 
            font-size: 16px; 
            background: #0d1117; 
            color: white; 
            border: 1px solid #30363d; 
            border-radius: 6px;
            box-sizing: border-box;
            text-align: center;
        }
        /* 入力欄をクリックしたときの光り方 */
        input:focus { border-color: #58a6ff; outline: none; }
        /* 「判定する」ボタンの設定 */
        button { 
            padding: 12px 24px; 
            font-size: 16px; 
            background: #1f6feb; /* ★鮮やかな青色に変更 */
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
            margin-top: 15px;
            width: 100%; /* ボタンを押しやすく横いっぱいに広げる */
            transition: background 0.2s;
        }
        button:hover { background: #388bfd; } /* マウスを乗せたときの色 */
        /* 結果が表示される場所の設定 */
        #result { margin-top: 25px; font-size: 18px; font-weight: bold; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="search-box">
        <h2>正規品シリアル判定</h2>
        <p>KARASUレバーのUID（シリアル番号）を入力してくれカァー(ﾟ ∑ ﾟ)</p>
        <input type="text" id="uidInput" placeholder="例: 5A:95:67:5B:1A:41:89">
        <button onclick="checkUID()">判定する</button>
        <div id="result"></div>
    </div>

    <script>
        // この下に、AirtableからダウンロードしたCSVの中身（UIDのリスト）をそのまま貼り付けます
        const allowedUIDs = [
            "5A:95:67:5B:1A:41:89",
            "ここに次のUIDを追加していく",
            "ここに次のUIDを追加していく"
        ];

        function checkUID() {
            const input = document.getElementById('uidInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (input === "") {
                resultDiv.innerHTML = "UIDを入力してください。";
                resultDiv.style.color = "black";
                return;
            }

            // リスト（allowedUIDs）の中に、入力された文字があるかないかだけを判定
            if (allowedUIDs.includes(input)) {
                resultDiv.innerHTML = "🟢 正規品（認証済み）<br>この製品は鴉がまぁまぁ魂込めて作った本物だョ。";
                resultDiv.style.color = "green";
            } else {
                resultDiv.innerHTML = "❌ 未登録の製品<br>ニセモノカァー(ﾟ ∑ ﾟ)";
                resultDiv.style.color = "red";
            }
        }
    </script>
</body>
</html>
