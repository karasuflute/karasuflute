<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>KARASUレバー 正規品判定システム</title>
    <!-- 暗号化（SHA-256）を行うための安全なライブラリを読み込み -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            text-align: center; 
            padding: 50px 20px; 
            background-color: #0d1117;
            background-image: url('icon.png');
            background-repeat: no-repeat;
            background-position: center 15%;
            background-size: 150px;
            background-attachment: fixed; 
            color: #c9d1d9; 
            margin: 0;
        }
        .intro-text {
            max-width: 500px;
            margin: 180px auto 30px auto; 
            background: rgba(22, 27, 34, 0.8);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
            text-align: left;
            line-height: 1.6;
        }
        .search-box { 
            background: #161b22; 
            padding: 40px 30px; 
            border-radius: 12px; 
            display: inline-block; 
            box-shadow: 0 0 20px rgba(0, 123, 255, 0.2); 
            border: 1px solid #30363d; 
            max-width: 450px;
            width: 100%;
            box-sizing: border-box;
        }
        h2 { color: #ffffff; margin-bottom: 10px; font-size: 24px; }
        p { color: #8b949e; font-size: 14px; margin-bottom: 25px; }
        input { 
            padding: 12px; 
            width: 100%; 
            font-size: 16px; 
            background: #0d1117; 
            color: white; 
            border: 1px solid #30363d; 
            border-radius: 6px;
            box-sizing: border-box;
            text-align: center;
        }
        input:focus { border-color: #58a6ff; outline: none; }
        button { 
            padding: 12px 24px; 
            font-size: 16px; 
            background: #1f6feb; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
            margin-top: 15px;
            width: 100%; 
            transition: background 0.2s;
        }
        button:hover { background: #388bfd; }
        #result { margin-top: 25px; font-size: 18px; font-weight: bold; line-height: 1.6; }
        .links-container { margin-top: 40px; }
        .btn-link {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            background: #21262d;
            border: 1px solid #30363d;
            transition: background 0.2s;
        }
        .btn-link:hover { background: #30363d; border-color: #8b949e; }
        .btn-booth { background: #ff4081; border-color: #ff4081; }
        .btn-booth:hover { background: #f50057; border-color: #f50057; }
    </style>
</head>
<body>

    <div class="intro-text">
        <p style="color: #ffffff; font-weight: bold; font-size: 16px; margin-bottom: 10px;">KARASUレバーをお迎えしてくれてありがとカァー(ﾟ ∑ ﾟ)</p>
        <p style="margin: 0; font-size: 14px; color: #c9d1d9;">
            確実に判定する場合はNFCリーダーアプリ（NFC Toolsなど）をダウンロードし、レバーボールの頂点にかざして「UID（シリアル番号）」を読み取ってください。<br>
            読み取ったUIDを下の検索窓に入力することで、正規品かどうかが分かります。
        </p>
    </div>

    <div class="search-box">
        <h2>正規品シリアル判定</h2>
        <p>KARASUレバーのUID（シリアル番号）を入力してくれカァー(ﾟ ∑ ﾟ)</p>
        <input type="text" id="uidInput" placeholder="例: 5A:95:67:5B:1A:41:89">
        <button onclick="checkUID()">判定する</button>
        <div id="result"></div>
    </div>

    <div class="links-container">
        <a href="https://booth.pm" target="_blank" class="btn-link btn-booth">[公式ショップ（BOOTH）]</a>
        <a href="https://x.com" target="_blank" class="btn-link">[鴉のX]</a>
        <a href="https://youtube.com" target="_blank" class="btn-link">[鴉のYouTube]</a>
    </div>

    <script>
        // ★ここには「暗号化された文字列」だけを載せます
        // ※「5A:95:67:5B:1A:41:89」を暗号化した文字列が以下です
        const allowedHashes = [
            "601362e604f326302489c629fbbe923838ff4ad43c3f0b2aa7e2212a4b8df2dd",
            "1616b037c1ea9993901a7ea5c470a035c8286259087845118cdabfb05dee97ab",
        ];

        function checkUID() {
            const input = document.getElementById('uidInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (input === "") {
                resultDiv.innerHTML = "UIDを入力してくれカァー(ﾟ ∑ ﾟ)";
                resultDiv.style.color = "#ffa23e";
                return;
            }

            // 入力されたUIDをその場で暗号化（SHA-256）
            const inputHash = CryptoJS.SHA256(input).toString();

            // 暗号文同士を比較する
            if (allowedHashes.includes(inputHash)) {
                resultDiv.innerHTML = "🟢 正規品（認証済み）<br>この製品は公式が製造した本物だョ(ﾟ ∑ ﾟ)";
                resultDiv.style.color = "#58a6ff";
            } else {
                resultDiv.innerHTML = "❌ 未登録の製品<br>偽物、または模倣品の可能性があるカァー(ﾟ ∑ ﾟ)";
                resultDiv.style.color = "#f85149";
            }
        }
    </script>
</body>
</html>
