<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 📱 スマホで文字や画面が小さくなるのを防ぐ最重要命令 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KARASUレバー 正規品判定システム</title>
    <style>
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            text-align: center; 
            padding: 30px 15px; /* スマホ用に全体の上下余白を少し詰める */
            background-color: #0d1117;
            background-image: url('icon.png');
            background-repeat: no-repeat;
            background-position: center 10%;
            background-size: 120px; /* スマホで見栄えが良いようにアイコンを少しコンパクトに */
            background-attachment: fixed; 
            color: #c9d1d9; 
            margin: 0;
            font-size: 16px; /* 基本の文字サイズをスマホ基準に */
        }
        .intro-text {
            max-width: 450px;
            margin: 150px auto 25px auto; /* アイコン画像との間隔をスマホ用に調整 */
            background: rgba(22, 27, 34, 0.85);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
            text-align: left;
            line-height: 1.6;
            box-sizing: border-box;
        }
        .search-box { 
            background: #161b22; 
            padding: 35px 20px; /* 左右の余白をスマホ向けに少し狭める */
            border-radius: 12px; 
            display: inline-block; 
            box-shadow: 0 0 20px rgba(0, 123, 255, 0.2); 
            border: 1px solid #30363d; 
            max-width: 450px;
            width: 100%;
            box-sizing: border-box; /* 画面からはみ出るのを防ぐ */
        }
        h2 { color: #ffffff; margin-bottom: 10px; font-size: 22px; } /* スマホで見やすい見出しサイズ */
        p { color: #8b949e; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        input { 
            padding: 14px; /* 指でタップしやすいように少し厚みを持たせる */
            width: 100%; 
            font-size: 16px; /* iPhoneでズームバグが起きない最適なサイズ */
            background: #0d1117; 
            color: white; 
            border: 1px solid #30363d; 
            border-radius: 6px;
            box-sizing: border-box;
            text-align: center;
            -webkit-appearance: none; /* スマホ特有の余計な影を消す */
        }
        input:focus { border-color: #58a6ff; outline: none; }
        button { 
            padding: 14px 24px; 
            font-size: 16px; 
            background: #1f6feb; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
            margin-top: 15px;
            width: 100%; 
            transition: background 0.2s;
            -webkit-appearance: none;
        }
        button:hover { background: #388bfd; }
        #result { margin-top: 25px; font-size: 18px; font-weight: bold; line-height: 1.6; }
        
        .links-container { 
            margin-top: 40px; 
            padding-bottom: 40px;
        }
        .simple-link {
            color: #58a6ff; 
            text-decoration: underline; 
            margin: 10px; /* スマホで押し間違えないように間隔を広げる */
            font-size: 15px;
            background: none;
            border: none;
            padding: 5px; /* タップ領域を広げる */
            cursor: pointer;
            font-family: inherit;
            display: inline-block; /* スマホの縦並び・横並びのバランス調整 */
        }
        .simple-link:hover {
            color: #79c0ff; 
        }
    </style>
</head>
<body>

    <div class="intro-text">
        <p style="color: #ffffff; font-weight: bold; font-size: 16px; margin-bottom: 10px; text-align: center;">KARASUレバーをお迎えしてくれてありがとカァー(ﾟ ∑ ﾟ)</p>
        <p style="margin: 0; font-size: 14px; color: #c9d1d9;">
            確実に判定する場合はNFCリーダーアプリをダウンロードし、レバーボールの頂点にかざして「UID（シリアル番号）」を読み取ってください。<br>
            読み取ったUIDを下の検索窓に入力することで、正規品かどうかが分かります。
        </p>
    </div>

    <div class="search-box">
        <h2>正規品シリアル判定</h2>
        <p>KARASUレバーのUID（シリアル番号）を入力してくれカァー(ﾟ ∑ ﾟ)</p>
        <input type="text" id="uidInput" placeholder="例: 5A:95:67:5B:1A:41:89">
        <button onclick="checkUID()">判定する</button>
        <div id="result"></div>
    </div>

    <div class="links-container">
        <button onclick="window.open('https://booth.pm', '_blank')" class="simple-link">[公式ショップ（BOOTH）]</button>
        <button onclick="window.open('https://x.com', '_blank')" class="simple-link">[鴉のX]</button>
        <button onclick="window.open('https://youtube.com', '_blank')" class="simple-link">[鴉のYouTube]</button>
    </div>

    <script>
        const allowedHashes = [
            "5071fbd98fb67d1bd5662ad69098b5d12349a21d40519fe1a2c1fac8fb05efe0"
        ];

        async function sha256(text) {
            const msgBuffer = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function checkUID() {
            const input = document.getElementById('uidInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (input === "") {
                resultDiv.innerHTML = "UIDを入力してくれカァー(ﾟ ∑ ﾟ)";
                resultDiv.style.color = "#ffa23e";
                return;
            }

            const inputHash = await sha256(input);

            if (allowedHashes.includes(inputHash)) {
                resultDiv.innerHTML = "🟢 正規品（認証済み）<br>この製品は公式が製造した本物だョ(ﾟ ∑ ﾟ)";
                resultDiv.style.color = "#58a6ff";
            } else {
                resultDiv.innerHTML = "❌ 未登録の製品<br>偽物、または模倣品の可能性があるカァー(ﾟ ∑ ﾟ)";
                resultDiv.style.color = "#f85149";
            }
        }
    </script>
</body>
</html>
