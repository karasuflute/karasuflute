<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>[KAAA] 正規品判定サイト</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f4; }
        .search-box { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { padding: 10px; width: 250px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; background: #007BFF; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="search-box">
        <h2>正規品シリアル判定</h2>
        <p>KARASUレバーのUID（シリアル番号）を入力してくれカァー(ﾟ ∑ ﾟ)</p>
        <input type="text" id="uidInput" placeholder="例: 5A:95:67:5B:1A:41:89">
        <button onclick="checkUID()">判定する</button>
        <div id="result"></div>
    </div>

    <script>
        // この下に、AirtableからダウンロードしたCSVの中身（UIDのリスト）をそのまま貼り付けます
        const allowedUIDs = [
            "5A:95:67:5B:1A:41:89",
            "ここに次のUIDを追加していく",
            "ここに次のUIDを追加していく"
        ];

        function checkUID() {
            const input = document.getElementById('uidInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (input === "") {
                resultDiv.innerHTML = "UIDを入力してください。";
                resultDiv.style.color = "black";
                return;
            }

            // リスト（allowedUIDs）の中に、入力された文字があるかないかだけを判定
            if (allowedUIDs.includes(input)) {
                resultDiv.innerHTML = "🟢 正規品（認証済み）<br>この製品は鴉がまぁまぁ魂込めて作った本物だョ。";
                resultDiv.style.color = "green";
            } else {
                resultDiv.innerHTML = "❌ 未登録の製品<br>ニセモノカァー(ﾟ ∑ ﾟ)";
                resultDiv.style.color = "red";
            }
        }
    </script>
</body>
</html>
